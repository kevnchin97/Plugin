<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Innovate</title>
    <style>
      html, body { height: 100%; margin: 0; background: #efefef; color: #1f1f1f; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; }
      .box { text-align: center; }
      .mark { font: 600 28px/1 system-ui, sans-serif; color: #2a64d8; letter-spacing: -0.02em; }
      p { color: #6b6b6b; margin: 10px 0 0; }
      .bar { width: 160px; height: 3px; margin: 18px auto 0; background: #dcdcdc; border-radius: 2px; overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #2a64d8; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark">[•] Innovate</div>
      <p>Opening your boards…</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
