<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Innovate · Settings</title>
  </head>
  <body>
    <div class="page">
      <div class="brand"><img src="/icon-48.png" alt="" />Save to Innovate</div>
      <p class="hint">Create a token in Innovate → Settings → Browser extension, then paste it here with your Innovate address.</p>
      <form id="form">
        <label for="base">Innovate address</label>
        <input id="base" type="url" required placeholder="https://innovate.example.com" />
        <label for="token">Token</label>
        <input id="token" type="password" required placeholder="inv_…" autocomplete="off" />
        <button type="submit">Save and connect</button>
        <div id="status" class="status" role="status"></div>
      </form>
    </div>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
