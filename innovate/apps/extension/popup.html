<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Innovate</title>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><img src="/icon-48.png" alt="" />Save to Innovate</div>
      <section id="setup" hidden>
        <p class="hint">Connect the extension to your Innovate workspace first.</p>
        <button id="open-options" type="button">Open settings</button>
      </section>
      <section id="main">
        <div class="card">
          <img id="preview" alt="" hidden />
          <div class="meta">
            <div class="title" id="title">…</div>
            <span class="chip" id="kind"></span><span class="chip" id="site"></span>
          </div>
        </div>
        <label for="board">Board</label>
        <select id="board"></select>
        <button id="save" type="button" disabled>Save to Innovate</button>
        <div id="status" class="status" role="status"></div>
        <p class="hint">Tip: right-click any image, video or link to save it directly.</p>
      </section>
    </div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
