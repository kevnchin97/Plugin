# Local services for Innovate: Postgres 16 + pgvector, Redis (BullMQ) and MinIO (S3 API).
# `docker compose up -d --wait` (or `pnpm services:up`) starts all three and waits for health checks.
name: innovate
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: innovate
      POSTGRES_PASSWORD: innovate
      POSTGRES_DB: innovate
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovate -d innovate"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO no longer publishes community images on Docker Hub; Chainguard's build is the
    # same MinIO server. Override with MINIO_IMAGE if you mirror your own.
    image: ${MINIO_IMAGE:-chainguard/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: innovate
      MINIO_ROOT_PASSWORD: innovate-secret
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      # The image has no curl; ask the ready endpoint over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
  miniodata:
