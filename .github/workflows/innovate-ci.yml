name: innovate-ci

on:
  push:
    paths: ["innovate/**", ".github/workflows/innovate-ci.yml"]
  pull_request:
    paths: ["innovate/**", ".github/workflows/innovate-ci.yml"]

defaults:
  run:
    working-directory: innovate

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: innovate, POSTGRES_PASSWORD: innovate, POSTGRES_DB: innovate }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U innovate" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: innovate/pnpm-lock.yaml }
      - name: System packages (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: MinIO
        # Service containers can't take a command, so start MinIO by hand.
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=innovate -e MINIO_ROOT_PASSWORD=innovate-secret chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break; sleep 1; done
      - run: cp .env.example .env && sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=ci-$(openssl rand -hex 24)|" .env
      - run: pnpm install --frozen-lockfile
      - name: CLIP model cache (search embeddings)
        uses: actions/cache@v4
        with: { path: innovate/.data/models, key: clip-vit-base-patch32-q-v1 }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fixtures
      # Migrate before unit tests: some (e.g. the worker's digest test) use the database.
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm --filter @innovate/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: "true" }
      # The same suite against the desktop app's single process (embedded database, no Docker services).
      - run: pnpm e2e:desktop
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: innovate/apps/web/playwright-report

  # The Windows app: build the installer, install it, and drive the installed app (scripts/smoke.mjs).
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: innovate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env
      # Hoisted node_modules: the standalone web server is copied into the app, and pnpm's symlinks don't survive that.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pnpm --filter @innovate/desktop package
      - name: Install silently
        run: |
          ./apps/desktop/dist/Innovate-Setup-*.exe //S
          for i in $(seq 1 60); do exe=$(ls "$LOCALAPPDATA"/Programs/*/Innovate.exe 2>/dev/null | head -1); [ -n "$exe" ] && break; sleep 2; done
          echo "installed: $exe"
          echo "INNOVATE_EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test the installed app
        run: node apps/desktop/scripts/smoke.mjs "$INNOVATE_EXE"
      - uses: actions/upload-artifact@v4
        with:
          name: Innovate-Setup-windows
          path: innovate/apps/desktop/dist/Innovate-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            innovate/apps/desktop/dist/smoke
            ~/AppData/Roaming/Innovate/logs
